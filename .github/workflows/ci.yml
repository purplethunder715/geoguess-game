name: CI

on:
  push:
    branches: [master]
  # Run on PRs too so contributor / Dependabot PRs get gated before merge.
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint + unit + e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cheapest checks first — failures surface within seconds and the
      # CI dashboard pinpoints which step broke. Order mirrors what the
      # `npm run lint:fix` + `npm test` + `npx playwright test` flow does
      # locally per CLAUDE.md's standing rule.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        # The CI runner is fresh every time, so we always install. `--with-deps`
        # adds the Linux system libs Chromium needs (libnss, etc.).
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        # E2E mocks Mapillary entirely — see tests/e2e/game-flow.spec.js
        # mockExternalsAndStubViewer() — so no token / network access needed.
        run: npm run test:e2e
